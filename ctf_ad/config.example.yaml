# Copy to config.yaml and fill in once the game starts.
# config.yaml is gitignored — never commit real team IPs / API tokens.

flag_regex: 'FLAG\{[A-Za-z0-9_\-]{5,100}\}'

# Your own team's IP(s), so the attack runner never fires exploits at yourself.
own_ips:
  - 10.60.0.2

# Enemy team hosts to attack. Fill in as soon as the scoreboard publishes them.
# This is the flat-IP mode (see ctf_ad/common/targets.py) for a generic A/D
# format with plain reachable IPs and no per-team flag-ID lookups. If the
# event instead assigns each team a fixed, team-number-derived address (e.g.
# FAUST CTF's IPv6 `fd66:666:<team>::2` scheme) and publishes per-round flag
# IDs, use `team_numbers` + `target_template` instead — see
# config.faustctf.example.yaml for a filled-in example of that mode.
teams:
  - 10.60.1.2
  - 10.60.2.2
  - 10.60.3.2

attack:
  # Set true only after reading the event's actual rules on scope/allowed
  # targets and confirming `teams` below is real, not this template's
  # placeholder IPs. The runner refuses to start otherwise — an exploit
  # loop firing at addresses nobody confirmed is in-scope is not a mistake
  # you want to make mid-event.
  acknowledged_rules: false
  timeout_seconds: 5
  concurrency: 20
  round_interval_seconds: 90   # match the game's flag-rotation tick once announced
  submission:
    backend: file             # file | http | tcp | null (null = print only, no submit)
    file:
      path: ctf_ad/captured_flags.txt
    http:
      url: "https://scoreboard.example/api/flags"
      method: POST
      flag_field: flag
      headers:
        Authorization: "Bearer CHANGEME"
      timeout_seconds: 5
    tcp:                      # ctf-gameserver's plaintext protocol (FAUST CTF and similar)
      host: submission.example
      port: 666
      timeout_seconds: 10
  # Only needed for ctf-gameserver-based events that require looking up a
  # flag by ID rather than scanning traffic for one. Omit/null to disable —
  # exploits then just get flag_ids=[] and behave like a plain scan.
  flag_ids:
    url: null                 # e.g. "https://2026.faustctf.net/competition/teams.json"
    refresh_seconds: 60
  state:
    seen_flags_path: ctf_ad/seen_flags.json
  logging:
    path: ctf_ad/attack.log
    level: INFO

defense:
  sniff:
    interface: null            # null = scapy default interface
    ports: [80, 22, 21, 25, 3306, 5432, 8080]
  healthcheck:
    interval_seconds: 30
    checks:
      - name: web
        type: http
        url: "http://127.0.0.1:80/"
        expect_status: 200
      - name: ssh
        type: tcp
        host: 127.0.0.1
        port: 22
  log_watch:
    paths:
      - /var/log/nginx/access.log
    extra_patterns:
      - '\.\./\.\./'          # path traversal
      - 'UNION\s+SELECT'      # sqli
      - '<script'             # xss
  logging:
    path: ctf_ad/defense.log
    level: INFO
